</head>

<body>
    <header>
        <nav class="nav-principal">
            <ul>
                <a href="/"><img src="../img/prueba1.png" alt="home" width="90px"></a>
                <li><a href="../../../portfolio.html">Portfolio</a></li>
                <li><a href="../../../lab.html">Lab</a></li>

                <li><a href="../../../about.html">About</a></li>
                <li><a href="../../../contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <aside class="sidebar-erp">
            <nav class="nav-home-erp">
                <ul>
                    <li><a href="home.html">ERP Home</a></li>
                    <li><a href="spare.html">Spare Parts</a></li>
                    <li><a href="inventory.html">Inventory</a></li>
                    <li><a href="orders-information.html">Orders</a></li>
                    <li><a href="production-tracking.html">Production</a></li>
                </ul>
            </nav>
        </aside>

        <section class="content-spare">
            <div class="title-format-spare">
                <h1>Spare Parts Management</h1>
                <p>Create, search and manage spare parts inventory.</p>
            </div>

            <div class="format-spares">
                <h2>Add New Spare Part</h2>

                <form class="spare-part-format">
                    <div class="form-group">
                        <label for="spare-part-name">Spare part name</label>
                        <input id="spare-part-name" name="spare-part-name" type="text">
                    </div>

                    <div class="form-group">
                        <label for="spare-part-number">Spare part number</label>
                        <input id="spare-part-number" name="spare-part-number" type="text">
                    </div>

                    <div class="form-group">
                        <label for="spare-parts-quantity">Quantity</label>
                        <input id="spare-parts-quantity" name="spare-part-quantity" type="number">
                    </div>

                    <div class="form-group">
                        <label for="select-area-spare-part">Associated area</label>
                        <select id="select-area-spare-part" name="select-area-spare-part">
                            <option value="">Select an area</option>
                            <option value="cutting">Cutting</option>
                            <option value="welding">Welding</option>
                            <option value="painting">Painting</option>
                            <option value="assembly">Assembly</option>
                            <option value="quality">Quality</option>
                            <option value="packaging">Packaging</option>
                            <option value="shipping">Shipping</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date-format-spares">Date</label>
                        <input id="date-format-spares" name="date-format-spares" type="datetime-local">
                    </div>

                    <button id="submit-format-spare-button" type="submit">Save spare part</button>
                </form>
            </div>

            <div class="search-spare-part">
                <h2>Search Spare Part</h2>

                <form class="search-spare-part-format">
                    <input id="search-part-input" name="search-part-input" type="text" placeholder="Search by name, number or area">
                    <button id="search-spare-part-button" type="submit">Search</button>
                </form>
            </div>

            <div class="spare-results">
                <h2>Saved Spare Parts</h2>
                <div id="sparePartsList"></div>
            </div>
        </section>
    </main>

    <footer>

</html>

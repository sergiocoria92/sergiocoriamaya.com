        <main class="contact-page">
            <section class="contact-container">

                <div class="social-icons">
                <a href="https://www.linkedin.com/in/sergiocoriamaya" target="_blank">LinkedIn</a>
                <a href="https://www.youtube.com/@sergiocoria328" target="_blank">YouTube</a>
                <a href="https://github.com/sergiocoria92/" target="_blank">GitHub</a>
                </div>

                <h1>Contact Me</h1>
                <p>Send me a message and I’ll get back to you soon.</p>

                <form id="contactForm" class="contact-form">
                <input type="hidden" name="_subject" value="New message from Sergio Coria website">
                <input type="hidden" name="_captcha" value="false">

                <input type="text" name="name" placeholder="Name" required>
                <input type="text" name="city" placeholder="City">
                <input type="tel" name="phone" placeholder="Phone">
                <input type="email" name="email" placeholder="Email" required>
                <textarea name="message" placeholder="Message" required></textarea>

                <button type="submit">Send Message</button>

                <p id="successMessage" class="success-message">Message sent successfully!</p>
                </form>

            </section>
        </main>
        <script src="../scripts/contact.js?v=11"></script>
